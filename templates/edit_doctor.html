{% extends 'base.html' %}{% block content %}<a class="back-link" href="{{ url_for('admin_catalog') }}">← Back to directory</a><header class="page-title"><p class="eyebrow">EDIT DOCTOR LISTING</p><h1>{{ doctor['full_name'] }}</h1></header><section class="card profile-form"><form method="post"><label>Doctor full name<input name="name" value="{{ doctor['full_name'] }}" required></label><label>Email<input name="email" type="email" value="{{ doctor['email'] }}" required></label><label>Specialization<select name="specialty_id" required>{% for s in specialties %}<option value="{{ s['id'] }}" {% if s['id'] == doctor['specialty_id'] %}selected{% endif %}>{{ s['name'] }}</option>{% endfor %}</select></label><label>Hospital<select name="hospital_id"><option value="">Not assigned</option>{% for h in hospitals %}<option value="{{ h['id'] }}" {% if h['id'] == doctor['hospital_id'] %}selected{% endif %}>{{ h['name'] }}</option>{% endfor %}</select></label><label>Qualification<input name="qualification" value="{{ doctor['qualification'] or '' }}"></label><label>Experience years<input name="experience_years" type="number" min="0" value="{{ doctor['experience_years'] or '' }}"></label><label>Contact<input name="contact" value="{{ doctor['contact'] or '' }}"></label><button class="button">Save doctor changes</button></form></section>{% endblock %}
