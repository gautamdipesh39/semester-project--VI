{% extends 'base.html' %}{% block content %}<a class="back-link" href="{{ url_for('admin_catalog') }}">← Back to directory</a><header class="page-title"><p class="eyebrow">EDIT HOSPITAL</p><h1>{{ hospital['name'] }}</h1></header><section class="card profile-form"><form method="post"><label>Hospital name<input name="name" value="{{ hospital['name'] }}" required></label><label>Province<input name="province" value="{{ hospital['province'] or '' }}"></label><label>District<input name="district" value="{{ hospital['district'] or '' }}"></label><label>City / municipality<input name="city" value="{{ hospital['city'] or '' }}"></label><label>Address<input name="address" value="{{ hospital['address'] or '' }}"></label><label>Hospital type<input name="hospital_type" value="{{ hospital['hospital_type'] or '' }}"></label><label>Contact<input name="contact" value="{{ hospital['contact'] or '' }}"></label><label>Google Maps link<input name="map_url" type="url" value="{{ hospital['map_url'] or '' }}"></label><label>Available specialties <small>Hold Command to select multiple.</small><select name="specialty_ids" multiple size="8">{% for s in specialties %}<option value="{{ s['id'] }}" {% if s['id'] in selected %}selected{% endif %}>{{ s['name'] }}</option>{% endfor %}</select></label><button class="button">Save hospital changes</button></form></section>{% endblock %}
