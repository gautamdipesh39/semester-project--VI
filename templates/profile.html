{% extends 'base.html' %}{% block content %}<header class="page-title"><p class="eyebrow">PATIENT PROFILE</p><h1>Health information</h1><p>Add only information you are comfortable sharing. It helps you keep an organised personal record; it does not change the AI result.</p></header><section class="card profile-form"><form method="post"><label>Age<input name="age" type="number" min="1" max="120" value="{{ user['age'] or '' }}"></label><label>Gender<select name="gender"><option value="">Prefer not to say</option>{% for option in ['Female','Male','Non-binary','Prefer to self-describe'] %}<option {% if profile and profile['gender'] == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label><label>Phone<input name="phone" value="{{ profile['phone'] if profile else '' }}"></label><label>Address / City<input name="address" value="{{ profile['address'] if profile else '' }}"></label><label>Known allergies<textarea name="allergies" rows="3" placeholder="Example: pollen, penicillin, no known allergies">{{ profile['allergies'] if profile else '' }}</textarea></label><label>Existing health conditions<textarea name="medical_conditions" rows="3" placeholder="Example: diabetes, asthma, none known">{{ profile['medical_conditions'] if profile else '' }}</textarea></label><label>Emergency contact<input name="emergency_contact" value="{{ profile['emergency_contact'] if profile else '' }}"></label><button class="button">Save profile</button></form></section>{% endblock %}
